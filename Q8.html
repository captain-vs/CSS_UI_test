<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url('https://t3.ftcdn.net/jpg/03/00/25/70/360_F_300257078_jOK2L3lIvnlHMoWrKAWtE7FBa4WI5jTf.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }


        .container{
            position: absolute;
            width: 100px;
            height: 70px;
            background-color: rgba(246, 144, 11, 0.648);
            color: rgb(219, 232, 232);
            left: 80%;
            top: 20px;
            padding: 20px;
        }

        .fixed{
            position: fixed;
            background-color: aqua;
            color: rgb(15, 15, 15);
            width: 100%;
            top: 95%;
            height: 20px;
            padding: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    
    <div class="container">

        This is a content box...
    </div>

    <div class="fixed">
        This is fixed position
    </div>


</body>
</html>
