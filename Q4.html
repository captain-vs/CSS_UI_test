<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
             margin: 0;
            padding: 0;
            background-color: lightgrey;
            padding-top: 50px;
        }

        .card {
            background-color: antiquewhite;
            max-width: 300px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            border-radius: 20px;
        }

        img {
            width: 100%;
            height: 250px;
            border: 4px solid rgb(255, 249, 249);
             border-radius: 20px;
        }

        h1 {
            font-family: 'Arial Black', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px silver;
            color: black;
            margin-top: 15px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
            text-decoration: underline;
            color: darkblue;
            margin: 10px 0;
        }

        p {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: normal;
            color: rgba(17, 60, 203, 0.699);
            
        }  
    </style>
</head>
<body>

    <div class="card">
        <img src="face.jpeg" alt="Student Profile Picture">
        <h1>Captain</h1>
        <h2>B.Tech Graduate</h2>
        <p>Good morning everyone. My name is Captain, and I just completed my B.Tech in CS from Mumbai University.</p>
    </div>

</body>
</html>
