<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightgrey;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .scene {
            perspective: 1000px;
            padding: 40px;
        }

        .card {
            width: 320px;
            height: 450px;
            background-color: white;
            border: 3px solid black;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            box-sizing: border-box;
            
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s ease;
            transform-style: preserve-3d;
        }

        .card:hover {
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            transform: translateZ(50px) rotateX(20deg) rotateY(30deg) rotateZ(5deg) skewX(-5deg) scale(1.05);
        }

        .image-box {
            width: 100%;
            height: 200px;
            background-image: url('https://my.clevelandclinic.org/-/scassets/Images/org/health/articles/facial-muscles');
            background-size: cover;
            background-position: center;
            border: 2px solid black;
            border-radius: 8px;
            margin-bottom: 25px;
            
            transition: transform 0.6s ease;
            transform: translateZ(20px);
        }

        .card:hover .image-box {
            transform: translateZ(40px) scale(0.95);
        }

        h1 {
            font-family: 'Arial Black', sans-serif;
            font-size: 24px;
            color: black;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            
            transition: transform 0.6s ease;
            transform: translateZ(15px);
        }

        .card:hover h1 {
            transform: translateZ(35px);
        }

        p {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: dimgray;
            line-height: 1.5;
            margin: 0;

            transition: transform 0.6s ease;
            transform: translateZ(10px);
        }

        .card:hover p {
            transform: translateZ(25px);
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="card">
            <div class="image-box"></div>
            <h1>3D Dimension</h1>
            <p>Hover over this component container to observe real-time spatial shifting using perspective parameters, three-dimensional rotations, and calculated axis coordinate adjustments instantly.</p>
        </div>
    </div>

</body>
</html>
