<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: lightgrey;
        }

        nav {
            background-color: black;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 550px;
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 40px;
            max-width: 600px;
            border-radius: 10px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: darkorange;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .hero {
                background-image: url('https://unsplash.com');
                height: 450px;
            }

            .content {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Destinations</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="hero">
        <div class="content">
            <h1>Adventure Awaits</h1>
            <p>Explore breathtaking locations worldwide and customize your personal itinerary with our modern booking interfaces effortlessly.</p>
        </div>
        <button>Explore Now</button>
    </div>

</body>
</html>
