<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightgrey;
            font-family: sans-serif;
        }

        nav {
            background-color: black;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .profile {
            background-color: antiquewhite;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid black;
        }

        .profile h1 {
            margin: 10px 0 5px 0;
            color: black;
        }

        .profile p {
            color: dimgray;
            margin: 0;
        }

        .box {
            display: flex;
            flex-direction: row;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background-color: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
        }

        .card h2 {
            font-size: 18px;
            color: black;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: darkblue;
        }

        @media (max-width: 800px) {
            .box {
                justify-content: center;
            }
            .card {
                width: 45%;
            }
        }

        @media (max-width: 500px) {
            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .profile {
                width: 90%;
                margin: 20px auto;
            }
            .box {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Dashboard</a>
        <a href="#">Courses</a>
        <a href="#">Grades</a>
        <a href="#">Schedule</a>
    </nav>

    <div class="profile">
        <img src="face.jpeg" alt="Student">
        <h1>Captain</h1>
        <p>B.Tech Computer Science | Semester 4</p>
    </div>

    <div class="box">
        <div class="card">
            <h2>Attendance</h2>
            <p>85%</p>
        </div>

        <div class="card">
            <h2>Current GPA</h2>
            <p>9.2</p>
        </div>

        <div class="card">
            <h2>Pending Tasks</h2>
            <p>4</p>
        </div>

        <div class="card">
            <h2>Credits Earned</h2>
            <p>64</p>
        </div>
    </div>

</body>
</html>
