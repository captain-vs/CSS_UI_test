<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max-width</title>
    <style>

        body {
            background-color: rgb(227, 36, 36);
        }
        @media (max-width: 300px) {
            body {
                background-color: rgb(0, 183, 244);
            }
        }
        @media (min-width: 600px) {
            body {
                background-color: rgb(0, 244, 57);
            }
        }
    </style>
</head>
<body>
    
</body>
</html>
