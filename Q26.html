<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightgrey;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            background-color: white;
            padding: 30px;
            border: 2px solid black;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            background-color: white;
            overflow: hidden;
            border: 2px solid black;
        }

        thead {
            background: linear-gradient(45deg, rgba(21, 21, 163, 0.701), purple, darkcyan);
            background-size: 300% 300%;
            animation: gradient-shift 6s ease infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        th {
            color: white;
            padding: 18px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            border-bottom: 2px solid black;
        }

        tbody tr {
            transition: background-color 0.3s ease;
        }

        tbody tr:nth-child(odd) {
            background-color: antiquewhite;
        }

        tbody tr:nth-child(even) {
            background-color: white;
        }

        tbody tr:hover {
            background-color: lightyellow;
        }

        td {
            padding: 15px 20px;
            color: black;
            font-size: 15px;
            border-bottom: 1px solid gray;
            transition: transform 0.2s ease, color 0.2s ease, font-weight 0.2s ease;
        }

        td:hover {
            transform: scale(1.05);
            color: darkblue;
            font-weight: bold;
        }

        td.item::before {
            content: "📦 ";
        }

        td.qty::before {
            content: "🔢 ";
        }

        td.price::before {
            content: "💰 ";
        }

        td.status::before {
            content: "⚡ ";
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="item">Wireless Headphones</td>
                    <td class="qty">12</td>
                    <td class="price">$99</td>
                    <td class="status">In Stock</td>
                </tr>
                <tr>
                    <td class="item">Smart Fitness Watch</td>
                    <td class="qty">5</td>
                    <td class="price">$149</td>
                    <td class="status">Low Stock</td>
                </tr>
                <tr>
                    <td class="item">Mechanical Keyboard</td>
                    <td class="qty">25</td>
                    <td class="price">$85</td>
                    <td class="status">In Stock</td>
                </tr>
                <tr>
                    <td class="item">Ergonomic Mouse</td>
                    <td class="qty">0</td>
                    <td class="price">$60</td>
                    <td class="status">Out of Stock</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
