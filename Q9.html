<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navigation Webpage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            background-color: black;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 1;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .section {
            height: 600px;
            padding: 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            max-width: 600px;
        }

        .one {
            background-color: rgb(240, 128, 128);
            color: rgb(145, 2, 2);
        }

        .two {
            background-color: lightblue;
            color: darkblue;
        }

        .three {
            background-color: lightgreen;
            color: darkgreen;
        }

        .four {
            background-color: lightyellow;
            color: saddlebrown;
        }

        .five {
            background-color: rgb(230, 230, 250);
            color: purple;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <div>
    <div id="home" class="section one">
        <h1>Welcome Home</h1>
        <p>This is the first section. The home page of the screen</p>
    </div>

    <div id="about" class="section two">
        <h1>About Our Work</h1>
        <p>This is the second section</p>
    </div>

    <div id="services" class="section three">
        <h1>Our Premium Services</h1>
        <p>This is the third section</p>
    </div>

    <div id="portfolio" class="section four">
        <h1>Featured Portfolio</h1>
        <p>This is the fourth section </p>
    </div>

    <div id="contact" class="section five">
        <h1>Get In Touch</h1>
        <p>This is the fifth section</p>
    </div>

    

</body>
</html>
