<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightgrey;
            font-family: sans-serif;
            padding-top: 50px;
        }

        .container {
            background-color: white;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            border: 2px solid black;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .box {
            background-color: antiquewhite;
            width: 250px;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
        }

        .small {
            height: 150px;
        }

        .medium {
            height: 220px;
        }

        .large {
            height: 300px;
        }

        h2 {
            margin-bottom: 10px;
            color: black;
        }

        p {
            color: darkblue;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .box {
                width: 90%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box small">
            <h2>Box 1</h2>
            <p>This is the short element block.</p>
        </div>

        <div class="box medium">
            <h2>Box 2</h2>
            <p>This is the intermediate height element block layout framework.</p>
        </div>

        <div class="box large">
            <h2>Box 3</h2>
            <p>This is the tallest container block element holding extra structural spacing boundaries inside the parent layer alignment workspace.</p>
        </div>
    </div>

</body>
</html>
